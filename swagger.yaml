id: swagger-api

info:
  name: Public Swagger/OpenAPI - Detect
  author: pdteam,c-sh0,AmirHossein Raeisi
  severity: info
  description: Public Swagger/OpenAPI documentation endpoint was detected.
  reference:
    - https://swagger.io/
    - https://spec.openapis.org/
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 92
    shodan-query: "http.title:\"swagger\""
  tags: exposure,api,swagger,openapi

http:
  - method: GET
    path:
      - "{{BaseURL}}{{paths}}"

    payloads:
      paths:
        # --- Swagger UI / JS ---
        - "/swagger-ui/swagger-ui.js"
        - "/swagger/swagger-ui.js"
        - "/swagger-ui.js"
        - "/swagger/ui/swagger-ui.js"
        - "/swagger/ui/index"
        - "/swagger/index.html"
        - "/swagger-ui.html"
        - "/swagger/swagger-ui.html"
        - "/swagger-ui/index.html"
        - "/api/swagger-ui.html"
        - "/swagger-ui/springfox.js"
        - "/swagger-ui/swagger-ui-standalone-preset.js"
        - "/swagger-ui/swagger-ui/swagger-ui-bundle.js"
        - "/swagger-ui-dist/swagger-ui-bundle.js"
        - "/webjars/swagger-ui/swagger-ui-bundle.js"
        - "/webjars/swagger-ui/index.html"
        # --- Swagger spec (generic) ---
        - "/api-docs/swagger.json"
        - "/api-docs/swagger.yaml"
        - "/api_docs"
        - "/swagger.json"
        - "/swagger.yaml"
        - "/swagger/v1/swagger.json"
        - "/swagger/v1/swagger.yaml"
        - "/swagger/v2/swagger.json"
        # --- .NET (Swashbuckle / NSwag, legacy) ---
        - "/swagger/docs/v1"
        - "/swagger/docs/v2"
        # --- /api/* variants ---
        - "/api/index.html"
        - "/api/doc"
        - "/api/doc.json"
        - "/api/docs/"
        - "/api/docs-json"
        - "/api/swagger.json"
        - "/api/swagger.yaml"
        - "/api/swagger.yml"
        - "/api/swagger_doc.json"
        - "/api/swagger/index.html"
        - "/api/swagger/swagger-ui.html"
        - "/api/swagger/static/index.html"
        - "/api/swagger/ui/index"
        - "/api/swagger"
        - "/api/api-docs"
        - "/api/api-docs/swagger.json"
        - "/api/api-docs/swagger.yaml"
        - "/api/swagger-ui/swagger.json"
        - "/api/swagger-ui/swagger.yaml"
        - "/api/swagger-ui/api-docs"
        - "/api/apidocs"
        - "/api/apidocs/swagger.json"
        - "/api/apidocs/swagger.yaml"
        - "/api/spec/swagger.json"
        - "/api/spec/swagger.yaml"
        - "/api/__swagger__/"
        - "/api/_swagger_/"
        - "/api/v1/swagger.json"
        - "/api/v2/swagger.json"
        - "/api/v3/swagger.json"
        - "/api/v1/swagger-ui/swagger.json"
        - "/api/v1/swagger-ui/swagger.yaml"
        - "/api/documentation"
        # --- swagger-resources (Springfox) ---
        - "/swagger-resources/restservices/v2/api-docs"
        - "/swagger-resources/configuration/ui"
        - "/swagger-resources/configuration/security"
        - "/api/swagger-resources"
        - "/api/swagger-resources/restservices/v2/api-docs"
        # --- Spring api-docs (Springfox/Springdoc) ---
        - "/v2/api-docs"
        - "/v3/api-docs"
        - "/v3/api-docs.yaml"
        - "/v3/api-docs/swagger-config"
        - "/api/v2/api-docs"
        - "/api/v3/api-docs"
        # --- OpenAPI 3.x (FastAPI, generic) ---
        - "/openapi.json"
        - "/openapi.yaml"
        - "/openapi.yml"
        - "/api/openapi.json"
        - "/api/openapi.yaml"
        - "/v1/openapi.json"
        - "/redoc"
        # --- short / root paths ---
        - "/__swagger__/"
        - "/_swagger_/"
        - "/docu"
        - "/docs"
        - "/docs/"
        - "/doc/"
        - "/swagger"
        - "/api-doc"
        - "/apidocs"
        - "/apidocs/"
        - "/documentation"
        - "/documentation/swagger.json"
        - "/rest/api-docs"
        - "/explorer/"
        - "/developers/documentation"

    headers:
      Accept: text/html
    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "swagger:"
          - "Swagger 2.0"
          - "\"swagger\":"
          - "Swagger UI"
          - "loadSwaggerUI"
          - "id=\"swagger-ui"
          - "\"openapi\":"
          - "openapi:"
          - "Redoc"
        condition: or

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - " @version (v[0-9]{1,3}.[0-9]{1,3}.[0-9]{1,3})"
